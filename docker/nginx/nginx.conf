# Reverse proxy for poly-stable-diffusion-webui.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf, so edits take effect with
#   docker compose -f docker-compose.https.yml restart nginx
# and never need an image rebuild.
#
# Point NGINX_CONF at a copy of this file to override it without editing it.

# The web UI (gradio) runs its queue over a WebSocket. Forward the Upgrade
# handshake when there is one; otherwise send an empty Connection header so
# keepalive to the upstream still works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    # No IPv6 listener: the default compose bridge network often has no IPv6,
    # and nginx refuses to start if it can't bind the socket.
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # img2img inputs, inpainting masks and PNG Info uploads can be large; 0
    # removes the cap entirely.
    client_max_body_size 0;

    location / {
        # "app" is the compose service name, 7860 the in-container port.
        proxy_pass http://app:7860;

        # 1.1 is required for keepalive and WebSockets to the upstream.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # $http_host, not $host: nginx strips the port from $host, so any URL the
        # app builds from it would point at https://<host>/ instead of :8443.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # The /sdapi/v1/* endpoints answer only when generation finishes, which
        # can take many minutes without sending a byte; the queue WebSocket can
        # also sit idle that long. The 60s default would drop either mid-job.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Stream large uploads and downloads straight through.
        proxy_buffering off;
        proxy_request_buffering off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}

# Optional HTTP -> HTTPS redirect.
#
# Only correct when HTTPS is published on 443: nginx cannot know which host port
# maps to this container, so it can't build a redirect to a non-standard port.
# If you set HTTPS_PORT=443, uncomment this and add "- 80:80" to the nginx ports.
